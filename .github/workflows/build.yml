name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      zip_name:
        description: 'Zip file name (e.g. editor.zip)'
        required: true
        default: 'editor.zip'
      app_name:
        description: 'App Display Name'
        required: true
        default: 'My Web App'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and Unzip source file
        run: |
          TARGET_ZIP="${{ github.event.inputs.zip_name }}"
          if [ -z "$TARGET_ZIP" ]; then
            TARGET_ZIP="3d-rubik's-cube.zip"
          fi

          if [ ! -f "$TARGET_ZIP" ]; then
            echo "Error: Could not find file named '$TARGET_ZIP'!"
            exit 1
          fi

          echo "Unzipping $TARGET_ZIP..."
          unzip -o "$TARGET_ZIP" -d .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies & Setup Capacitor
        run: |
          npm install
          npm install -D @capacitor/cli
          npm install @capacitor/core @capacitor/android

          APP_TITLE="${{ github.event.inputs.app_name }}"
          if [ -z "$APP_TITLE" ]; then
            APP_TITLE="My Web App"
          fi

          # Initialize Capacitor configuration dynamically
          npx cap init "$APP_TITLE" "com.app.standalone" --web-dir "dist"

      - name: Build Web Application
        run: npx vite build

      - name: Add Android Platform & Sync
        run: |
          npx cap add android
          npx cap sync android

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

